<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ICHEY — Launching soon." />
    <meta name="theme-color" content="#fff5f9" />
    <title>ICHEY — Launching Soon</title>
    <link rel="icon" type="image/png" href="ichey-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div aria-hidden="true" class="ambient">
      <div class="ambient__glow ambient__glow--mint"></div>
      <div class="ambient__glow ambient__glow--coral"></div>
      <div class="ambient__glow ambient__glow--sun"></div>
      <div class="ambient__glow ambient__glow--violet"></div>
      <div class="ambient__glow ambient__glow--sky"></div>
      <div class="ambient__confetti" id="ambient-confetti"></div>
    </div>

    <div class="flash-overlay" id="flash-overlay" aria-hidden="true"></div>

    <div id="falling-gifts" class="falling-gifts" aria-live="polite"></div>

    <a class="skip-link" href="#store-dock">Skip to app availability</a>

    <div id="experience" class="experience">
      <canvas id="ichey-canvas" class="experience__canvas" aria-hidden="true"></canvas>

      <div class="experience__fallback" id="experience-fallback">
        <img src="ichey-logo.png" width="160" height="160" alt="ICHEY logo" />
        <p class="experience__fallback-name">ICHEY</p>
        <p class="experience__fallback-launch">Launching Soon</p>
        <p class="experience__fallback-note">Something wonderful is on its way.</p>
      </div>

      <div class="experience__controls">
        <button type="button" class="gift-btn gift-btn--primary" id="gift-open-btn">
          Open Your Gift
        </button>
      </div>

      <aside
        id="store-dock"
        class="store-dock"
        aria-labelledby="stores-heading"
        data-store-dock
      >
        <h2 id="stores-heading" class="store-dock__heading">Coming soon to your phone</h2>
        <p class="store-dock__line">ICHEY is getting ready to arrive.</p>
        <div class="stores__badges">
          <div class="store-badge" aria-label="Google Play — available soon">
            <img src="google-play-badge.svg" width="180" height="54" alt="" decoding="async" />
          </div>
          <div class="store-badge" aria-label="App Store — available soon">
            <img src="apple-app-store-badge.svg" width="160" height="54" alt="" decoding="async" />
          </div>
        </div>
        <p class="stores__status">
          <span class="stores__status-dot" aria-hidden="true"></span>
          Available soon
        </p>
      </aside>

      <h1 class="visually-hidden">ICHEY — Launching Soon</h1>
    </div>

    <noscript>
      <style>
        .experience__canvas,
        .experience__controls {
          display: none !important;
        }
        .experience__fallback {
          display: grid !important;
        }
        .store-dock {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.min.js",
          "three/addons/": "./assets/vendor/"
        }
      }
    </script>
    <script type="module" src="scene.js"></script>
  </body>
</html>
